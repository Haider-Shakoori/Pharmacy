name: Flutter Mobile CI

on:
  push:
    branches: [main, 'feat/**']
    paths:
      - 'mobile/**'
      - '.github/workflows/flutter-mobile.yml'
  pull_request:
    branches: [main]
    paths:
      - 'mobile/**'
      - '.github/workflows/flutter-mobile.yml'

jobs:
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true

      - name: Show toolchain
        run: flutter --version

      - name: Bootstrap Android host
        run: bash tool/bootstrap_android.sh

      - name: Resolve packages
        run: flutter pub get

      - name: Generate Drift database code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Check Dart formatting
        run: |
          dart format lib test
          git diff --exit-code -- lib test

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build optimized Android test APKs
        run: flutter build apk --release --split-per-abi

      - name: Verify APK signatures and report sizes
        run: |
          set -euo pipefail
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)
          test -x "$APKSIGNER"
          for apk in build/app/outputs/flutter-apk/app-*-release.apk; do
            "$APKSIGNER" verify --verbose "$apk"
            du -h "$apk"
          done

      - name: Upload ARM64 optimized test APK
        uses: actions/upload-artifact@v4
        with:
          name: darmaltoon-android-arm64-test
          path: mobile/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          if-no-files-found: error

      - name: Upload ARM32 optimized test APK
        uses: actions/upload-artifact@v4
        with:
          name: darmaltoon-android-arm32-test
          path: mobile/build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
          if-no-files-found: error
