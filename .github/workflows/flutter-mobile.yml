name: Flutter Mobile CI

on:
  push:
    branches: [main, 'feat/**']
    paths:
      - 'mobile/**'
      - '.github/workflows/flutter-mobile.yml'
  pull_request:
    branches: [main]
    paths:
      - 'mobile/**'
      - '.github/workflows/flutter-mobile.yml'

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true

      - name: Show toolchain
        run: flutter --version

      - name: Bootstrap Android host
        run: bash tool/bootstrap_android.sh

      - name: Resolve packages
        run: flutter pub get

      - name: Generate Drift database code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Format Dart source
        run: dart format lib test

      - name: Commit formatting to Android feature branch
        if: github.head_ref == 'feature/darmaltoon-android-ui' || github.ref == 'refs/heads/feature/darmaltoon-android-ui'
        working-directory: .
        run: |
          if ! git diff --quiet -- mobile/lib mobile/test; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add mobile/lib mobile/test
            git commit -m 'style(android): apply Dart formatter'
            git push origin HEAD:feature/darmaltoon-android-ui
          fi

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build optimized Android APK
        run: flutter build apk --release --dart-define=API_BASE_URL=https://darmaltoon.com

      - name: Upload Android APK
        uses: actions/upload-artifact@v6
        with:
          name: businessos-pharmacy-android-apk
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
