name: Darmaltoon Android Emulator Screenshots

on:
  push:
    branches:
      - feature/darmaltoon-registration-link-20261123
    paths:
      - '.github/workflows/darmaltoon-emulator-preview.yml'
      - 'mobile/**'
  workflow_dispatch:

jobs:
  emulator-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true
      - name: Bootstrap Android project
        run: bash tool/bootstrap_android.sh
      - name: Install dependencies
        run: flutter pub get
      - name: Generate database sources
        run: dart run build_runner build --delete-conflicting-outputs
      - name: Build Android APK
        run: flutter build apk --debug
      - name: Boot emulator, install APK and capture actual app
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          working-directory: mobile
          script: |
            mkdir -p screenshots
            adb install -r build/app/outputs/flutter-apk/app-debug.apk
            PACKAGE=$(aapt dump badging build/app/outputs/flutter-apk/app-debug.apk | sed -n "s/package: name='\([^']*\)'.*/\1/p")
            echo "APK package: $PACKAGE"
            adb shell monkey -p "$PACKAGE" -c android.intent.category.LAUNCHER 1
            sleep 25
            adb shell screencap -p /sdcard/darmaltoon-launch.png
            adb pull /sdcard/darmaltoon-launch.png screenshots/darmaltoon-launch.png
            adb logcat -d -t 1500 > screenshots/emulator-logcat.txt
      - name: Upload actual screenshots and APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: darmaltoon-android-emulator-preview
          path: |
            mobile/screenshots/
            mobile/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: warn
