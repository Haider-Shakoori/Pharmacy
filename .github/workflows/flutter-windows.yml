name: Flutter Windows Offline EXE

on:
  workflow_dispatch:
  push:
    branches: [main, 'feat/**']
    paths:
      - 'mobile/**'
      - '.github/workflows/flutter-windows.yml'
  pull_request:
    branches: [main]
    paths:
      - 'mobile/**'
      - '.github/workflows/flutter-windows.yml'

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true

      - name: Bootstrap Windows host
        shell: pwsh
        run: .\tool\bootstrap_windows.ps1

      - name: Resolve packages
        run: flutter pub get

      - name: Generate Drift database code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Check Dart formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test
