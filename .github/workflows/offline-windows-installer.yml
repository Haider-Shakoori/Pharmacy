# Internal branch pushes produce an unprotected validation installer; customer releases require ionCube.
name: Offline Windows Installer

on:
  push:
    branches:
      - feat/offline-windows-installer
    paths:
      - 'offline/**'
      - 'app/Services/Offline/**'
      - 'app/Services/Licensing/**'
      - 'app/Http/Controllers/Offline/**'
      - 'app/Http/Controllers/Api/OfflineLicenseActivationController.php'
      - 'app/Http/Middleware/EnsureOfflineLicense.php'
      - 'app/Http/Middleware/EnsureOperationalSubscription.php'
      - 'app/Console/Commands/Offline*.php'
      - 'app/Console/Commands/InstallOfflinePharmacy.php'
      - 'app/Console/Commands/SyncOfflineNetworkDomains.php'
      - 'config/offline.php'
      - 'routes/**'
      - 'bootstrap/app.php'
      - '.github/workflows/offline-windows-installer.yml'
  workflow_dispatch:
    inputs:
      version:
        description: Installer version, for example 1.0.0
        required: true
        default: 0.1.0
        type: string
      source_protection:
        description: Internal validation build or protected customer build
        required: true
        default: none
        type: choice
        options:
          - none
          - ioncube

permissions:
  contents: read

concurrency:
  group: offline-installer-${{ github.ref }}-${{ github.event_name == 'workflow_dispatch' && inputs.source_protection || 'none' }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Windows EXE
    runs-on: ${{ (github.event_name == 'workflow_dispatch' && inputs.source_protection == 'ioncube') && 'businessos-ioncube' || 'windows-latest' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_mysql, pdo_sqlite, sodium, curl, intl, fileinfo, zip, gd
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'

      - name: Install PHP dependencies
        shell: pwsh
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare test environment
        shell: pwsh
        run: |
          Copy-Item .env.example .env -Force
          php artisan key:generate

      - name: Run Laravel regression suite
        shell: pwsh
        run: php artisan test

      - name: Check PHP formatting
        shell: pwsh
        run: vendor/bin/pint --test

      - name: Install frontend dependencies
        shell: pwsh
        run: npm install --no-audit --no-fund

      - name: Build frontend
        shell: pwsh
        run: npm run build

      - name: Prepare production Composer dependencies
        shell: pwsh
        run: composer install --no-dev --optimize-autoloader --no-interaction --prefer-dist --no-progress

      - name: Resolve installer public verification key
        id: license_key
        shell: pwsh
        env:
          CONFIGURED_PUBLIC_KEY: ${{ secrets.LICENSE_SIGNING_PUBLIC_KEY_B64 }}
          PROTECTION_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.source_protection || 'none' }}
        run: |
          $key = $env:CONFIGURED_PUBLIC_KEY
          if ([string]::IsNullOrWhiteSpace($key) -and (Test-Path 'offline/license-public-key.txt')) {
            $key = (Get-Content 'offline/license-public-key.txt' -Raw).Trim()
          }

          if ([string]::IsNullOrWhiteSpace($key)) {
            throw 'No BusinessOS license verification public key is configured.'
          }

          "public_key=$key" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Build one-click installer
        shell: pwsh
        env:
          IONCUBE_ENCODER_EXE: ${{ secrets.IONCUBE_ENCODER_EXE }}
        run: |
          $version = if ('${{ github.event_name }}' -eq 'workflow_dispatch') { '${{ inputs.version }}' } else { '0.1.0-dev' }
          $protection = if ('${{ github.event_name }}' -eq 'workflow_dispatch') { '${{ inputs.source_protection }}' } else { 'none' }
          ./offline/scripts/Build-OfflineInstaller.ps1 -RepositoryRoot "${{ github.workspace }}" -Version "$version" -LicensePublicKey "${{ steps.license_key.outputs.public_key }}" -SourceProtection "$protection" -IonCubeEncoderPath "$env:IONCUBE_ENCODER_EXE"

      - name: Verify installer exists
        shell: pwsh
        run: |
          $installer = Get-ChildItem offline/dist/installer -Filter '*.exe' | Select-Object -First 1
          if (-not $installer) { throw 'Installer EXE was not created.' }
          Get-FileHash $installer.FullName -Algorithm SHA256

      - name: Smoke-install generated EXE
        shell: pwsh
        run: |
          $installer = Get-ChildItem offline/dist/installer -Filter '*.exe' | Select-Object -First 1
          if (-not $installer) { throw 'Installer EXE was not created.' }

          $setupLog = Join-Path $env:RUNNER_TEMP 'businessos-pharmacy-setup.log'
          $arguments = @(
            '/VERYSILENT',
            '/SUPPRESSMSGBOXES',
            '/NORESTART',
            "/LOG=$setupLog",
            '/LOG=D:\a\_temp\businessos-pharmacy-setup.log',
            '"/PHARMACYNAME=BusinessOS Smoke Pharmacy"',
            '"/OWNERNAME=Smoke Administrator"',
            '/OWNEREMAIL=smoke@businessos.local',
            '/OWNERPASSWORD=SmokePassword123!'
          )

          $process = Start-Process -FilePath $installer.FullName -ArgumentList $arguments -Wait -PassThru
          if ($process.ExitCode -ne 0) {
            if (Test-Path 'D:\a\_temp\businessos-pharmacy-setup.log') {
              Get-Content 'D:\a\_temp\businessos-pharmacy-setup.log' -Tail 200
            }
            if (Test-Path 'C:\ProgramData\BusinessOS\Pharmacy\logs\install.log') {
              Get-Content 'C:\ProgramData\BusinessOS\Pharmacy\logs\install.log' -Tail 250
            }
            throw "Installer smoke test failed with exit code $($process.ExitCode)."
          }

          $requiredServices = @(
            'BusinessOSPharmacyDB',
            'BusinessOSPharmacyPHP',
            'BusinessOSPharmacyWeb',
            'BusinessOSPharmacyQueue'
          )

          foreach ($serviceName in $requiredServices) {
            $service = Get-Service -Name $serviceName -ErrorAction SilentlyContinue
            if (-not $service) {
              if (Test-Path 'C:\ProgramData\BusinessOS\Pharmacy\logs\install.log') {
                Get-Content 'C:\ProgramData\BusinessOS\Pharmacy\logs\install.log' -Tail 250
              }
              throw "$serviceName was not installed."
            }
            if ($service.Status -ne 'Running') {
              throw "$serviceName is not running after installation."
            }
          }

          $ready = $false
          for ($attempt = 1; $attempt -le 20; $attempt++) {
            try {
              $response = Invoke-WebRequest -Uri 'http://127.0.0.1:8090/offline/license' -UseBasicParsing -TimeoutSec 5
              if ($response.StatusCode -eq 200 -and $response.Content -match 'License activation') {
                $ready = $true
                break
              }
            } catch {
              Start-Sleep -Seconds 2
            }
          }

          if (-not $ready) {
            Get-Service -Name 'BusinessOSPharmacy*' | Format-Table -AutoSize
            throw 'Installed BusinessOS Pharmacy did not serve the local license page.'
          }

          Write-Host 'Generated EXE installed successfully and local Pharmacy services are healthy.'

      - name: Upload Windows installer
        uses: actions/upload-artifact@v6
        with:
          name: businessos-pharmacy-offline-${{ github.event_name == 'workflow_dispatch' && inputs.source_protection || 'none' }}-${{ github.event_name == 'workflow_dispatch' && inputs.version || '0.1.0-dev' }}
          path: |
            offline/dist/installer/*.exe
            offline/dist/installer/*.sha256
            offline/dist/UNPROTECTED-INTERNAL-BUILD.txt
          if-no-files-found: error
          retention-days: 14
