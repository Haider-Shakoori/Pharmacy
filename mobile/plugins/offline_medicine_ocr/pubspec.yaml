name: offline_medicine_ocr
description: Offline Android and iOS OCR for Darmaltoon medicine labels.
version: 0.1.0
publish_to: none

environment:
  sdk: '>=3.13.0 <4.0.0'
  flutter: '>=3.24.0'

dependencies:
  flutter:
    sdk: flutter

flutter:
  plugin:
    platforms:
      android:
        package: af.businessos.offline_medicine_ocr
        pluginClass: OfflineMedicineOcrPlugin
      ios:
        pluginClass: OfflineMedicineOcrPlugin
